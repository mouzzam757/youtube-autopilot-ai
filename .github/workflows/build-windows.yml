
name: Build YouTube Autopilot AI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-unpacked
          $folder = Get-ChildItem ffmpeg-unpacked -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force ffmpeg
          Copy-Item "$($folder.FullName)/bin/ffmpeg.exe" ffmpeg/
          Copy-Item "$($folder.FullName)/bin/ffprobe.exe" ffmpeg/

      - name: Build Windows application
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name YouTube-Autopilot-AI --add-binary "ffmpeg/ffmpeg.exe;ffmpeg" --add-binary "ffmpeg/ffprobe.exe;ffmpeg" app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Autopilot-AI-Windows-Portable
          path: dist/YouTube-Autopilot-AI.exe
