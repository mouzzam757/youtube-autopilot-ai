
name: Build YouTube Autopilot AI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get application files
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r YouTube_Autopilot_AI/requirements.txt

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-unpacked
          $folder = Get-ChildItem ffmpeg-unpacked -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force YouTube_Autopilot_AI/ffmpeg
          Copy-Item "$($folder.FullName)/bin/ffmpeg.exe" YouTube_Autopilot_AI/ffmpeg/
          Copy-Item "$($folder.FullName)/bin/ffprobe.exe" YouTube_Autopilot_AI/ffmpeg/

      - name: Create standalone EXE
        shell: pwsh
        run: |
          cd YouTube_Autopilot_AI
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name YouTube-Autopilot-AI `
            --add-binary "ffmpeg/ffmpeg.exe;ffmpeg" `
            --add-binary "ffmpeg/ffprobe.exe;ffmpeg" `
            app.py

      - name: Upload finished application
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Autopilot-AI-Windows-Portable
          path: YouTube_Autopilot_AI/dist/YouTube-Autopilot-AI.exe
